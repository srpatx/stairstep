name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Pinned to the version title_chaining (the consumer) runs.
          ruby-version: 3.3.4
          bundler-cache: true

      - name: RSpec
        run: bundle exec rspec

      - name: Standard
        run: bundle exec standardrb
